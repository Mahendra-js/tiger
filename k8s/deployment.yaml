apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-mass
spec:
  template:
    metadata:
      type: mass
    spec:
      containers:
      - name: app
        image: mahijs/dell-app:latest
        ports:
        - containerPort: 80
  replicas: 3
  selector:
    matchLabels:
      type: mass
